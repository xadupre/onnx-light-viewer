<svg xmlns="http://www.w3.org/2000/svg" width="780" height="260" viewBox="0 0 780 260" role="img" aria-labelledby="title desc">
  <title id="title">PipelineProto inspection and saving</title>
  <desc id="desc">Opening a pipeline exposes independent embedding, prefill and decode stages. Navigation, inference and fusion select a stage. Saving writes a new complete pipeline; the source is unchanged.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="780" height="260" rx="12" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="14" text-anchor="middle" fill="#0f172a" stroke="#334155">
    <rect x="16" y="91" width="150" height="72" rx="8" fill="#ffffff"/>
    <rect x="228" y="16" width="324" height="202" rx="10" fill="#e0f2fe"/>
    <rect x="250" y="55" width="280" height="36" rx="6" fill="#ffffff"/>
    <rect x="250" y="99" width="280" height="36" rx="6" fill="#ffffff"/>
    <rect x="250" y="143" width="280" height="36" rx="6" fill="#ffffff"/>
    <rect x="614" y="91" width="150" height="72" rx="8" fill="#ffffff"/>
    <path d="M166 127H222" fill="none" marker-end="url(#arrow)"/>
    <path d="M552 127H608" fill="none" marker-end="url(#arrow)"/>
    <g stroke="none">
      <text x="91" y="120">Source .pipe-onnx</text>
      <text x="91" y="142" font-size="12">Unchanged on disk</text>
      <text x="390" y="41" font-weight="bold">Pipeline overview + settings</text>
      <text x="390" y="78">embedding (optional)</text>
      <text x="390" y="122">prefill (required)</text>
      <text x="390" y="166">decode (optional)</text>
      <text x="390" y="201" font-size="12">Stage links: inspect / infer / fuse</text>
      <text x="689" y="120">Complete copy</text>
      <text x="689" y="142" font-size="12">All stages + settings</text>
      <text x="196" y="112" font-size="12">Open</text>
      <text x="582" y="112" font-size="12">Save</text>
      <text x="390" y="245" font-size="13">Independent model scopes; no generation or model execution</text>
    </g>
  </g>
</svg>
