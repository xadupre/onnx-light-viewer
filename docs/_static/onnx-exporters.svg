<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 160" role="img" aria-labelledby="title description">
  <title id="title">Export an ONNX model, then inspect it</title>
  <desc id="description">An external exporter writes an ONNX model and optional weight files. ONNX Light Viewer opens the model for inspection, without exporting or executing it.</desc>
  <style>
    .background { fill: #f8fafc; }
    .card { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    .text { fill: #0f172a; font-family: sans-serif; font-size: 16px; }
    .heading { font-size: 19px; font-weight: bold; }
    .product { font-size: 16px; }
    .arrow { fill: none; stroke: #475569; stroke-width: 2; }
    .arrow-head { fill: #475569; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0f172a; }
      .card { fill: #172554; stroke: #60a5fa; }
      .text { fill: #e2e8f0; }
      .arrow { stroke: #94a3b8; }
      .arrow-head { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" class="arrow-head"/>
    </marker>
  </defs>
  <rect width="960" height="160" rx="16" class="background"/>
  <g class="text">
    <rect x="20" y="20" width="300" height="120" rx="12" class="card"/>
    <text x="40" y="55" class="heading">External exporter</text>
    <text x="40" y="88">Run outside the viewer</text>
    <text x="40" y="116">Choose a model and runtime</text>
    <rect x="420" y="20" width="210" height="120" rx="12" class="card"/>
    <text x="440" y="55" class="heading">ONNX files</text>
    <text x="440" y="88">Model graph</text>
    <text x="440" y="116">Optional weight files</text>
    <rect x="730" y="20" width="210" height="120" rx="12" class="card"/>
    <text x="750" y="55" class="heading product">ONNX Light Viewer</text>
    <text x="750" y="88">Open and inspect</text>
    <text x="750" y="116">No model execution</text>
    <g class="arrow" marker-end="url(#arrow)">
      <path d="M 320 80 H 420"/>
      <path d="M 630 80 H 730"/>
    </g>
    <text x="370" y="65" text-anchor="middle">write</text>
    <text x="680" y="65" text-anchor="middle">open</text>
  </g>
</svg>
