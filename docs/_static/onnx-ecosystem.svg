<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-labelledby="title description">
  <title id="title">ONNX and ONNX Runtime</title>
  <desc id="description">ONNX defines the interoperable model format. ONNX Runtime runs ONNX models and powers generative AI inference through onnxruntime-genai.</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      [fill="#f8fafc"] { fill: #0f172a; }
      [fill="#475569"] { fill: #94a3b8; }
      [stroke="#475569"] { stroke: #94a3b8; }
      [fill="#334155"] { fill: #e2e8f0; }
      [fill="#dbeafe"] { fill: #172554; }
      [stroke="#2563eb"] { stroke: #60a5fa; }
      [fill="#1e3a8a"] { fill: #bfdbfe; }
      [fill="#dcfce7"] { fill: #052e16; }
      [stroke="#15803d"] { stroke: #4ade80; }
      [fill="#14532d"] { fill: #bbf7d0; }
      [fill="#f3e8ff"] { fill: #3b0764; }
      [stroke="#9333ea"] { stroke: #c084fc; }
      [fill="#581c87"] { fill: #e9d5ff; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="800" height="220" rx="16" fill="#f8fafc"/>
  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 230 110 H 295"/>
    <path d="M 505 110 H 570"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <g fill="#334155" font-size="14">
      <text x="262" y="96">models</text>
      <text x="537" y="96">powers</text>
    </g>
    <rect x="20" y="55" width="210" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="125" y="95" fill="#1e3a8a" font-size="21" font-weight="bold">onnx</text>
    <text x="125" y="124" fill="#334155" font-size="16">Interoperable</text>
    <text x="125" y="146" fill="#334155" font-size="16">model format</text>
    <rect x="295" y="55" width="210" height="110" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="400" y="95" fill="#14532d" font-size="21" font-weight="bold">onnxruntime</text>
    <text x="400" y="124" fill="#334155" font-size="16">Cross-platform</text>
    <text x="400" y="146" fill="#334155" font-size="16">model inference</text>
    <rect x="570" y="55" width="210" height="110" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text x="675" y="95" fill="#581c87" font-size="18" font-weight="bold">onnxruntime-genai</text>
    <text x="675" y="124" fill="#334155" font-size="16">Generative AI</text>
    <text x="675" y="146" fill="#334155" font-size="16">model inference</text>
  </g>
</svg>
