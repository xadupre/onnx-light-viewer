name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-format:
    name: C++ formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: git ls-files -z '*.cc' '*.h' | xargs -0 clang-format-18 --dry-run --Werror

  tests:
    name: Unit tests and formatting (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest uses ARM64, required by the GenAI macOS wheels.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test/requirements.txt
      - run: python -m pip install -r test/requirements.txt
      - run: python -c "import onnx_light_cpu; onnx_light_cpu.register_kernels()"
      - run: npm ci
      - run: npm run format:check
      - run: npm test
