name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests and formatting (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest uses ARM64, required by the GenAI macOS wheels.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test/requirements.txt
      - run: python -m pip install -r test/requirements.txt
      - run: python -c "import onnx_light_cpu; onnx_light_cpu.register_kernels()"
      - run: npm ci
      - run: npm run format:check
      - if: runner.os == 'Linux'
        run: clang-format --dry-run --Werror native/*.cc native/*.h
      - run: npm test
